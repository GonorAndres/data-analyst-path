name: Deploy Portfolio Hub to Cloudflare Pages

# Replaces the six deploy-frontend-*.yml workflows. The dashboards are no longer
# six Vercel projects on six hostnames; they are one Cloudflare Pages project
# serving all of them from data-analyst.gonor.me under their own paths. Project
# 02 later joined them at /cohorts, replacing a Streamlit service on Cloud Run.
#
# A single workflow is the point, not an accident of consolidation: the apps
# share a merged `dist/` tree, so building only the one that changed would
# publish a tree missing the other six.

on:
  push:
    branches: [main, dev]
    paths:
      - "projects/00-demo-aestehtics/src/**"
      - "projects/00-demo-aestehtics/public/**"
      - "projects/01-insurance-claims-dashboard/src/**"
      - "projects/01-insurance-claims-dashboard/public/**"
      # Project 02's app is nested in web/, so the projects/*/ globs below miss
      # it -- it needs its own entries, including the JSON it renders from.
      - "projects/02-ecommerce-cohort-analysis/web/src/**"
      - "projects/02-ecommerce-cohort-analysis/web/public/**"
      - "projects/02-ecommerce-cohort-analysis/web/package.json"
      - "projects/02-ecommerce-cohort-analysis/web/next.config.js"
      - "projects/02-ecommerce-cohort-analysis/web/tailwind.config.ts"
      - "projects/03-ab-test-analysis/src/**"
      - "projects/03-ab-test-analysis/public/**"
      - "projects/04-executive-kpi-report/src/**"
      - "projects/04-executive-kpi-report/public/**"
      - "projects/05-financial-portfolio-tracker/src/**"
      - "projects/05-financial-portfolio-tracker/public/**"
      - "projects/06-operational-efficiency/src/**"
      - "projects/06-operational-efficiency/public/**"
      - "projects/*/package.json"
      - "projects/*/next.config.js"
      - "projects/*/tailwind.config.ts"
      - "functions/**"
      - "scripts/build-hub.mjs"
      - "wrangler.jsonc"
      - "e2e/**"
      - ".github/workflows/deploy-hub.yml"
  # Also run on the PR itself, without deploying. Without this the gate only
  # fires on push to main/dev -- that is, after the merge decision has already
  # been made, which is the one moment a deploy gate is no use.
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pull requests build and test but never deploy, so they need no environment
    # and no access to its secrets.
    environment: ${{ github.event_name == 'pull_request' && '' || (github.ref == 'refs/heads/main' && 'production' || 'preview') }}
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: wrangler 4.123 refuses to start on Node 20, which takes
          # `wrangler pages dev` down with it and so takes the whole deploy gate
          # down. The Next builds are happy on either. deploy-streamlit.yml stays
          # on 20 -- it uses Node only for Playwright and never touches wrangler.
          node-version: 22

      - name: Install root tooling
        # Playwright and wrangler only. The dashboards' own dependencies are
        # installed per project by the build script.
        run: npm ci

      # Seven `npm ci` runs plus seven `next build` runs. Caching the npm
      # downloads is worth it; caching node_modules is not, since each project
      # has its own.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          # Both globs: project 02's lockfile is at projects/*/web/, which the
          # single-level pattern does not match, so a change there would reuse a
          # stale cache key.
          key: ${{ runner.os }}-npm-${{ hashFiles('projects/*/package-lock.json', 'projects/*/web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Typecheck the Pages Functions
        # Wrangler compiles Functions with esbuild, which strips types without
        # checking them -- a type error would otherwise reach production silently.
        run: npm run typecheck:functions

      - name: Build and merge the seven dashboards
        # Fails loudly if two apps emit the same path with different content --
        # see the collision rule in scripts/build-hub.mjs.
        run: node scripts/build-hub.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Deploy gate tests
        # Runs against `wrangler pages dev`, the same runtime that serves
        # production, so Pages URL semantics and the Functions are covered. No
        # backend runs here; the specs assert only on what renders without data.
        run: npx playwright test --config=e2e/hub.config.ts

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # `main` is the project's production branch, so it publishes to
          # data-analyst.gonor.me. Any other branch gets a preview URL.
          npx wrangler pages deploy dist \
            --project-name=data-analyst-hub \
            --branch="${GITHUB_REF_NAME}" \
            --commit-dirty=true | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Verify the deployment serves every dashboard
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Checked against the deployment URL rather than the custom domain, so
          # a preview is verified as itself and a production run is verified
          # before DNS-level caching can mask a bad publish.
          BASE="${DEPLOY_URL:-https://data-analyst.gonor.me}"
          echo "Verifying $BASE"
          FAIL=0
          # Pages propagates per asset, so a single check straight after publish
          # reports whichever routes happen to be live at that instant. A run was
          # failed once by /portfolio/ answering 404 while its seven siblings
          # answered 200; it was serving normally a minute later. Retry each path
          # before believing it.
          for P in / /insurance/ /cohorts/ /abtest/ /kpi/ /portfolio/ /operations/ /airbnb/ /olist/; do
            HTTP=000
            for ATTEMPT in 1 2 3 4 5 6; do
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" -H 'Cache-Control: no-cache' --max-time 20 "$BASE$P" || true)
              [ "$HTTP" = "200" ] && break
              sleep 10
            done
            if [ "$HTTP" = "200" ]; then
              echo "PASS $P -> 200"
            else
              echo "FAIL $P -> $HTTP (after 6 attempts over ~60s)"
              FAIL=1
            fi
          done
          # The API proxy is the piece with no static fallback: if the Function
          # or its origin is wrong, the dashboards render empty and nothing else
          # in this workflow would notice.
          # Cloud Run runs at min-instances=0. A container that has been idle can
          # take longer to answer its first request than any single timeout worth
          # setting, so this retries rather than asserting once -- it failed a
          # production run on exactly that, then answered in 0.3s by hand a
          # minute later.
          HTTP=000
          for ATTEMPT in 1 2 3 4 5; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$BASE/api/insurance/health" || true)
            [ "$HTTP" = "200" ] && break
            echo "  /api/insurance/health -> $HTTP (attempt $ATTEMPT, cold start)"
            sleep 15
          done
          if [ "$HTTP" = "200" ]; then
            echo "PASS /api/insurance/health -> 200"
          else
            echo "FAIL /api/insurance/health -> $HTTP after 5 attempts"
            FAIL=1
          fi
          # /cohorts is the one dashboard whose data ships in the deployment
          # rather than coming from Cloud Run, and the repo's global `*.json`
          # ignore rule once excluded it -- which builds, deploys and serves a
          # dashboard with no numbers on it. Cheap to rule out here.
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE/cohorts/data/meta.json" || true)
          if [ "$HTTP" = "200" ]; then
            echo "PASS /cohorts/data/meta.json -> 200"
          else
            echo "FAIL /cohorts/data/meta.json -> $HTTP (dashboard would render empty)"
            FAIL=1
          fi
          exit $FAIL
