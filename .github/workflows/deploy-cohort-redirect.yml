# Keeps the retired Streamlit dashboard's Cloud Run URL alive as a redirect.
#
# This workflow replaced deploy-streamlit.yml. Project 02 was rebuilt as a
# static export served from the hub at /cohorts, so there is no Streamlit app
# left to deploy -- but the service cannot simply be deleted. Its run.app
# hostname was linked from gonor.me, from the blog in two languages, and from
# this repo's own README for months, and a deleted Cloud Run service answers
# 404. So the service stays and serves nothing but a 308 to the canonical path.
#
# The old test job is gone with it: it pulled parquet from GCS, booted
# Streamlit and drove it with Playwright, none of which has anything left to
# test. The gate that matters now lives in e2e/hub.spec.ts, which covers
# /cohorts as part of the merged hub.
name: Deploy cohort redirect to Cloud Run

on:
  push:
    branches: [main, dev]
    paths:
      - "ops/cohort-redirect/**"
      - ".github/workflows/deploy-cohort-redirect.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  # Unchanged on purpose. The point of this service is that its URL keeps
  # working, and the URL is derived from the service name.
  SERVICE_NAME: da-cohort-streamlit
  REPO_NAME: da-portfolio-api
  CANONICAL_URL: https://data-analyst.gonor.me/cohorts/

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            ops/cohort-redirect
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          # 128Mi is enough for nginx serving one static response, and the port
          # moves from Streamlit's 8501 to nginx's 8080.
          flags: |
            --memory=128Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
            --allow-unauthenticated
            --port=8080

      - name: Verify the redirect
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
                  --region=${{ env.REGION }} --format='value(status.url)')
          echo "Service URL: $URL"

          # -o /dev/null, no -L: the assertion is about the redirect itself, so
          # following it would test the hub instead of this service.
          for i in 1 2 3 4 5; do
            read -r CODE TARGET <<<"$(curl -s -o /dev/null \
              -w '%{http_code} %{redirect_url}' --max-time 15 "$URL/" || true)"
            if [ "$CODE" = "308" ] && [ "$TARGET" = "${{ env.CANONICAL_URL }}" ]; then
              echo "PASS: / -> $CODE $TARGET (attempt $i)"
              break
            fi
            echo "Attempt $i: got '$CODE $TARGET' -- retrying in 10s"
            sleep 10
          done
          if [ "$CODE" != "308" ] || [ "$TARGET" != "${{ env.CANONICAL_URL }}" ]; then
            echo "FAIL: expected 308 -> ${{ env.CANONICAL_URL }}, got '$CODE $TARGET'"
            exit 1
          fi

          # A path that only ever existed in Streamlit must land on the
          # dashboard root, not carry its path onto a page that does not exist.
          read -r CODE TARGET <<<"$(curl -s -o /dev/null \
            -w '%{http_code} %{redirect_url}' --max-time 15 \
            "$URL/Retencion_por_Cohortes" || true)"
          if [ "$CODE" != "308" ] || [ "$TARGET" != "${{ env.CANONICAL_URL }}" ]; then
            echo "FAIL: retired Streamlit path gave '$CODE $TARGET'"
            exit 1
          fi
          echo "PASS: retired Streamlit path -> $CODE $TARGET"
