# Live URL registry for the Data Analyst portfolio.
# Single source of truth consumed by:
#   - .github/workflows/ops-health.yml  (health cron)
#   - CLAUDE.md / README references
#
# Branch -> environment mapping:
#   main -> production (deployed + monitored)
#   dev  -> preview    (Pages preview URL; API/Streamlit skip deploy)
#
# When a URL changes (custom domain, Cloud Run redeploy with a different service
# name) update this file first, then let workflows pick it up.

schema_version: 1
updated: 2026-08-17

services:

  # The Next.js dashboards used to be six Vercel projects on six hostnames.
  # They are now one Cloudflare Pages project: each app is built as a static
  # export and merged into a single tree by scripts/build-hub.mjs, so every
  # dashboard is a path on this one host. The sub_services below are what used
  # to be separate top-level entries. Project 02 joined them at /cohorts once its
  # Streamlit service was rebuilt as a static export.
  - id: portfolio-hub
    project: projects/00..06 (merged)
    kind: cloudflare_pages
    pages_project: data-analyst-hub
    production_url: https://data-analyst.gonor.me
    health_path: /
    expected_status: [200]
    # Trailing slashes are deliberate: the exports are built with
    # `trailingSlash: true`, so the bare path answers 308 and only the slashed
    # form is a 200. sub_services are checked strictly against 200.
    sub_services:
      - { id: insurance,  path: /insurance/ }
      - { id: cohorts,    path: /cohorts/ }
      - { id: abtest,     path: /abtest/ }
      - { id: kpi,        path: /kpi/ }
      - { id: portfolio,  path: /portfolio/ }
      - { id: operations, path: /operations/ }
      - { id: airbnb,     path: /airbnb/ }
      - { id: olist,      path: /olist/ }
      # Liveness of the Functions layer itself, with no outbound call. Separates
      # "the Pages Functions are down" from "the origin behind them is down",
      # which the two probes below cannot distinguish on their own.
      - { id: functions,  path: /health }
      # The Pages Function that fronts Cloud Run. It has no static fallback --
      # if it breaks, every dashboard renders empty while still returning 200,
      # which none of the checks above would catch.
      - { id: api-proxy,  path: /api/insurance/health }
      # The PostHog proxy. Blocked or broken, analytics goes silent with no
      # other symptom.
      - { id: ingest-proxy, path: /ingest/static/array.js }
      # /cohorts is the only dashboard whose data ships inside the deployment
      # rather than coming from the API, so it has a failure mode none of the
      # others do: the page serves 200 with no numbers on it. The repo's global
      # `*.json` ignore rule excluded these files at first, which is exactly how
      # that happens.
      - { id: cohorts-data, path: /cohorts/data/meta.json }

  - id: cohort-streamlit
    project: 02-ecommerce-cohort-analysis
    kind: cloud_run
    gcp_service: da-cohort-streamlit
    region: us-central1
    production_url: https://da-cohort-streamlit-451451662791.us-central1.run.app
    health_path: /_stcore/health
    expected_status: [200]

  - id: portfolio-api
    project: backend
    kind: cloud_run
    gcp_service: da-portfolio-api
    region: us-central1
    production_url: https://da-portfolio-api-451451662791.us-central1.run.app
    health_path: /health
    expected_status: [200]
    # Sub-services exposed by the consolidated API. Each is curled separately
    # by the health cron. These are the origin behind the hub's /api/* proxy.
    sub_services:
      - { id: insurance, path: /insurance/health }
      - { id: olist,     path: /olist/health }
      - { id: abtest,    path: /abtest/health }
      - { id: kpi,       path: /kpi/health }
      - { id: portfolio, path: /portfolio/health }
      - { id: ops,       path: /ops/health }
